[build]
  # Force the build to run from the repository root. Setting this here
  # overrides any Base directory configured in the Netlify UI, which was
  # resolving publish/functions paths under frontend/ (e.g. frontend/frontend/dist).
  base = "."
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "vite"
  targetPort = 5173
  autoLaunch = false

# Proxy API calls to functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
